name: Periodic AI Dev Workflow

on:
  schedule:
    # Run every 5 minutes (minimum allowed by GitHub Actions)
    # Note: Issue #6 requests "10 times a minute" but GitHub Actions
    # has a minimum interval of 5 minutes for scheduled workflows
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  run-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run AI Dev Workflow
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_API_KEY: ${{ secrets.GH_API_KEY }}
          GITHUB_REPO_NAME: ${{ secrets.GITHUB_REPO_NAME }}
        run: poetry run ai-dev
