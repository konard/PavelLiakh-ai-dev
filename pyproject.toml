[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-dev"
version = "1.0.0"
description = "AI-powered developer"
authors = ["godlikekrabik@gmail.com <godlikekrabik@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/PavelLiakh/ai-dev"
homepage = "https://github.com/PavelLiakh/ai-dev"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
openai = "^1.60.2"
tinydb = "^4.8.2"
uvicorn = "^0.34.0"
fastapi = "^0.115.8"
python-dotenv = "^1.0.1"
deepdiff = "^8.2.0"
requests-mock = "^1.12.1"
nicegui = "^2.13.0"
pygithub = "^2.6.1"
gitpython = "^3.1.44"
instructor = "^1.7.9"
tree-sitter = "^0.21.2"
setuptools = "^79.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-cov = "6.0.0"
black = "^25.1.0"
pylint = "^3.3.4"
pytest-html = "^4.1.1"

[tool.poetry.scripts]
build-grammar = "scripts.build_grammar:main"
ai-dev = "src.main:main"

[tool.pytest.ini_options]
markers = [
    "feature: Tests related to the features testing",
    "integration: Tests involving multiple components interacting",
    "unit: Tests that check individual components",
    "manual_e2e: Manual end-to-end tests",
    "in_progress: Tests in progress state",
    "smoke: Smoke tests",
]

testpaths = ["tests"]

python_files = "*_test.py"
python_classes = "Test*"
python_functions = "test_*"

addopts = "--verbose --cov=src --cov-report=term-missing --cov-report html:test_report/htmlcov"
[pytest]
addopts = "--verbose --html=test_report/report.html --self-contained-html"